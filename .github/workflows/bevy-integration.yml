name: Bevy Integration (manual)

# Bevy integration tests are run manually (workflow_dispatch) to keep PRs fast
on:
  workflow_dispatch:

jobs:
  bevy-tests:
    name: Bevy integration tests (Linux xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          override: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxss-dev libasound2-dev

      - name: Run headless Bevy tests under Xvfb
        run: |
          xvfb-run -s "-screen 0 1280x720x24" cargo test --test bevy_integration -- --nocapture

# This workflow is not triggered on PRs by default; run manually from the Actions tab when needed.
