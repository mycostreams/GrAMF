[package]
name = "GrAMF"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
calamine = "0.37.0"
cgmath = "0.18.0"
chrono = "0.4.45"
egui = "0.34"
egui-wgpu = { version = "0.34", features = ["winit"] }
egui-winit = "0.34.2"
env_logger = "0.11.10"
futures = "0.3.32"
hdf5-metno = { version = "0.15", features = ["static", "zlib"] }
log = "0.4.29"
nalgebra-glm = { version = "0.20.0", features = [
    "convert-bytemuck",
    "serde-serialize",
] }
pollster = "0.4.0"
rfd = "0.17.2"
sha2 = "0.11.1"
ureq = "3.4.2"
web-time = "1.1.0"
wgpu = { version = "29", default-features = false }
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
