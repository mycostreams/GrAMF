[package]
name = "GrAMF"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
cgmath = "0.18.0"
egui = "0.34"
egui-wgpu = { version = "0.34", features = ["winit"] }
egui-winit = "0.34.2"
env_logger = "0.11.10"
futures = "0.3.32"
log = "0.4.29"
nalgebra-glm = { version = "0.20.0", features = [
    "convert-bytemuck",
    "serde-serialize",
] }
pollster = "0.4.0"
web-time = "1.1.0"
wgpu = { version = "29", default-features = false }
winit = "0.30.13"
